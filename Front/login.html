<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión — StockManager</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="auth-logo-icon">📦</div>
          <span class="auth-logo-text">StockManager</span>
        </div>

        <h1 class="auth-title">Bienvenido</h1>
        <p class="auth-subtitle">Ingresa tus credenciales para continuar</p>

        <div id="alert" class="alert alert-error"></div>

        <form id="login-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="admin@stockmanager.com"
              autocomplete="email"
            />
            <span id="email-error" class="field-error"></span>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <span id="password-error" class="field-error"></span>
          </div>

          <button
            type="submit"
            id="submit-btn"
            class="btn btn-primary auth-submit"
          >
            Ingresar
          </button>
        </form>

        <p class="auth-footer">
          ¿No tienes cuenta?
          <a href="register.html">Registrarse</a>
        </p>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      initLogin();
    </script>
  </body>
</html>
